name: Build & release APK

# Every push to main runs the tests and builds the APK.
# When main has a versionName (app/build.gradle.kts) that has no release yet, the workflow
# creates the release v<versionName> with the APK attached. So to ship a new version:
# bump versionCode + versionName, push to main. Done.
# Pushing a v* tag or publishing a release by hand also attaches the APK.
on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Read app version
        id: version
        run: echo "tag=v$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Engine tests
        run: ./gradlew :core:test

      - name: Build release APK
        id: build
        env:
          # Two repository secrets hold the signing key, so every release is signed with the same
          # key and updates install over the previous version. Without them the APK is still built
          # (to check the code compiles) but no release is published.
          KEYSTORE_BASE64: ${{ secrets.BORRALOCO_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.BORRALOCO_SIGNING_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$SIGNING_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export CLEANLINK_KEYSTORE="$RUNNER_TEMP/release.jks"
            export CLEANLINK_KEYSTORE_PASSWORD="$SIGNING_PASSWORD"
            export CLEANLINK_KEY_PASSWORD="$SIGNING_PASSWORD"
            export CLEANLINK_KEY_ALIAS=borraloco
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Signing secrets are not set: building a debug-signed APK and skipping the release."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
          ./gradlew :app:assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/BorraLoco-${{ steps.version.outputs.tag }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: BorraLoco-apk
          path: dist/*.apk

      - name: Check whether this version is already released
        id: released
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.build.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release new version
        if: steps.released.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: BorraLoco ${{ steps.version.outputs.tag }}
          body_path: .github/release-notes.md
          files: dist/*.apk

      - name: Attach APK to tagged release
        if: startsWith(github.ref, 'refs/tags/v') && steps.build.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
