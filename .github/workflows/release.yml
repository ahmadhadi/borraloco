name: Build & release APK

# Runs the tests and builds the app on every push.
# Publishing a GitHub Release (or pushing a tag such as v1.0) attaches the APK to that release.
on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Engine tests
        run: ./gradlew :core:test

      - name: Build release APK
        env:
          # Optional: add these repository secrets to sign with your own key.
          # Without them the APK is signed with a throwaway debug key.
          CLEANLINK_KEYSTORE_BASE64: ${{ secrets.CLEANLINK_KEYSTORE_BASE64 }}
          CLEANLINK_KEYSTORE_PASSWORD: ${{ secrets.CLEANLINK_KEYSTORE_PASSWORD }}
          CLEANLINK_KEY_ALIAS: ${{ secrets.CLEANLINK_KEY_ALIAS }}
          CLEANLINK_KEY_PASSWORD: ${{ secrets.CLEANLINK_KEY_PASSWORD }}
        run: |
          if [ -n "$CLEANLINK_KEYSTORE_BASE64" ]; then
            echo "$CLEANLINK_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export CLEANLINK_KEYSTORE="$RUNNER_TEMP/release.jks"
          fi
          ./gradlew :app:assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Desactiva-${GITHUB_REF_NAME//\//-}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Desactiva-apk
          path: dist/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
